<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142a3d" />
      <stop offset="100%" stop-color="#0a151f" />
    </linearGradient>
    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123d38" />
      <stop offset="100%" stop-color="#0a1f1c" />
    </linearGradient>
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a143d" />
      <stop offset="100%" stop-color="#150a1f" />
    </linearGradient>
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2814" />
      <stop offset="100%" stop-color="#1f140a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="50" y="55" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">web-motion-templates</text>
  <text x="50" y="80" font-size="13" font-weight="400" fill="#94a3b8">Interactive React, Tailwind CSS &amp; Framer Motion Micro-Components</text>

  <!-- 4 Component Cards -->
  <!-- Card 1: Magnetic Button -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="430" height="215" rx="14" fill="url(#cardBlue)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="85" cy="150" r="16" fill="#38bdf8" fill-opacity="0.15" />
    <text x="85" y="156" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">🧲</text>
    <text x="115" y="156" font-size="16" font-weight="600" fill="#f8fafc">Magnetic Button</text>

    <text x="75" y="195" font-size="12" fill="#cbd5e1">• Cursor attraction physics with customizable pull strength</text>
    <text x="75" y="220" font-size="12" fill="#cbd5e1">• Framer Motion spring transition on mouse exit snapback</text>
    <text x="75" y="245" font-size="12" fill="#cbd5e1">• Active tap scale down micro-feedback</text>
    <text x="75" y="270" font-size="12" fill="#cbd5e1">• Zero dependencies beyond React + Framer Motion</text>
    <text x="75" y="300" font-size="11" fill="#38bdf8">&lt;MagneticButton strength={0.35}&gt; ... &lt;/MagneticButton&gt;</text>
  </g>

  <!-- Card 2: Glow Card -->
  <g filter="url(#shadow)">
    <rect x="520" y="115" width="430" height="215" rx="14" fill="url(#cardCyan)" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="555" cy="150" r="16" fill="#2dd4bf" fill-opacity="0.15" />
    <text x="555" y="156" font-size="15" font-weight="700" fill="#2dd4bf" text-anchor="middle">✨</text>
    <text x="585" y="156" font-size="16" font-weight="600" fill="#f8fafc">Spotlight Glow Card</text>

    <text x="545" y="195" font-size="12" fill="#cbd5e1">• Linear cursor coordinate tracking via getBoundingClientRect</text>
    <text x="545" y="220" font-size="12" fill="#cbd5e1">• Dynamic radial-gradient border spotlight highlight</text>
    <text x="545" y="245" font-size="12" fill="#cbd5e1">• Frosted glass backdrop blur with subtle slate borders</text>
    <text x="545" y="270" font-size="12" fill="#cbd5e1">• Highly customizable glow radius and accent colors</text>
    <text x="545" y="300" font-size="11" fill="#2dd4bf">&lt;GlowCard glowColor="rgba(56,189,248,0.2)"&gt; ... &lt;/GlowCard&gt;</text>
  </g>

  <!-- Card 3: Command Palette -->
  <g filter="url(#shadow)">
    <rect x="50" y="360" width="430" height="225" rx="14" fill="url(#cardPurple)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="85" cy="395" r="16" fill="#c084fc" fill-opacity="0.15" />
    <text x="85" y="401" font-size="15" font-weight="700" fill="#c084fc" text-anchor="middle">⌘</text>
    <text x="115" y="401" font-size="16" font-weight="600" fill="#f8fafc">Raycast Command Palette</text>

    <text x="75" y="440" font-size="12" fill="#cbd5e1">• Global ⌘K / Ctrl+K keyboard shortcut listener</text>
    <text x="75" y="465" font-size="12" fill="#cbd5e1">• Instant fuzzy/substring search filtering</text>
    <text x="75" y="490" font-size="12" fill="#cbd5e1">• AnimatePresence spring entrance and backdrop blur dismiss</text>
    <text x="75" y="515" font-size="12" fill="#cbd5e1">• Keyboard navigation with action callback execution</text>
    <text x="75" y="550" font-size="11" fill="#c084fc">&lt;CommandPalette isOpen={open} items={commands} /&gt;</text>
  </g>

  <!-- Card 4: Animated Tabs -->
  <g filter="url(#shadow)">
    <rect x="520" y="360" width="430" height="225" rx="14" fill="url(#cardOrange)" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="555" cy="395" r="16" fill="#fb923c" fill-opacity="0.15" />
    <text x="555" y="401" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle">📑</text>
    <text x="585" y="401" font-size="16" font-weight="600" fill="#f8fafc">Sliding Pill Animated Tabs</text>

    <text x="545" y="440" font-size="12" fill="#cbd5e1">• Framer Motion layoutId shared element morphing</text>
    <text x="545" y="465" font-size="12" fill="#cbd5e1">• Liquid spring physics indicator sliding between tab items</text>
    <text x="545" y="490" font-size="12" fill="#cbd5e1">• Accessible keyboard focus and hover state enhancements</text>
    <text x="545" y="515" font-size="12" fill="#cbd5e1">• Compact frosted capsule styling</text>
    <text x="545" y="550" font-size="11" fill="#fb923c">&lt;AnimatedTabs tabs={tabs} activeTab={active} /&gt;</text>
  </g>
</svg>
